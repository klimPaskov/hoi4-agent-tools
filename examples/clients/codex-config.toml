# Codex registration for a global install (npm install --global hoi4-agent-tools).
# On Windows, set command = "hoi4-agent-tools.cmd".
# hoi4-agent-tools-setup --print-client-config prints this entry with your paths filled in.
[mcp_servers.hoi4_agent_tools]
command = "hoi4-agent-tools"
startup_timeout_sec = 120
tool_timeout_sec = 600
env = { HOI4_AGENT_STDIO_IDLE_EXIT_MINUTES = "30" }
