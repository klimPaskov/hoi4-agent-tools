[package]
name = "hoi4-txn"
description = "Atomic rewrite engine and journal: applies a RewritePlan with stale-source checks and recovery (packet P2)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hoi4-core.workspace = true
getrandom = "0.3.3"
hoi4-engine.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"

[features]
# Lets the HOI4_TXN_TEST_ABORT_AFTER_REPLACE variable abort a rewrite, for the cross-recovery tests
# of the TypeScript server. Release builds never enable it.
test-abort = []

[lints]
workspace = true
