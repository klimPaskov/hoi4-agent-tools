name: Engine

on:
  push:
    branches: [main]
    paths: ['engine/**', '.github/workflows/engine.yml']
  pull_request:
    paths: ['engine/**', '.github/workflows/engine.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --no-fail-fast --locked
      - run: cargo build --release --locked -p hoi4-engine-cli
      - run: cargo run --release --locked -p hoi4-engine-cli -- roundtrip fixtures/game fixtures/mods/b001
