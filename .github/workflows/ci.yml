name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Prose-only changes skip the matrix. docs/tools.md is generated from the tool definitions and
    # checked by a test, so it still runs it. Later patterns override earlier ones.
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'docs/tools.md'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its running checks. Pushes to main each run in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run four jobs that keep both Node versions, every OS and macOS arm64.
        # Pushes to main and manual runs keep the full three-by-two matrix.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","node":22},{"os":"ubuntu-latest","node":24},{"os":"windows-latest","node":24},{"os":"macos-latest","node":24}]' || '[{"os":"ubuntu-latest","node":22},{"os":"ubuntu-latest","node":24},{"os":"windows-latest","node":22},{"os":"windows-latest","node":24},{"os":"macos-latest","node":22},{"os":"macos-latest","node":24}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      # Tools on the shared Rust engine (hoi4.mod_index and the inspect tools) need a
      # hoi4-engine binary; tests/helpers/engine-binary.ts finds this build, and the real-engine
      # tests that skip without one run too. A release build keeps those tests fast.
      - name: Build hoi4-engine for the tests
        working-directory: engine
        run: |
          rustup toolchain install
          cargo build --release --locked -p hoi4-engine-cli
      - run: npm run check
      # Coverage runs the whole suite a second time (about 40 minutes), so only main measures it.
      - if: github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run test:coverage
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run inspector

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          tags: hoi4-agent-tools:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
